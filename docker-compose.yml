# Instalación completa: base de datos, API y aplicación web.
#   cp .env.example .env   (y cambia los valores)
#   docker compose up -d --build
# La aplicación queda en http://localhost:${HTTP_PORT:-8080}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__HelpDesk: Host=db;Database=helpdesk;Username=helpdesk;Password=${POSTGRES_PASSWORD}
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      Auth__Microsoft__Enabled: ${MICROSOFT_LOGIN_ENABLED:-false}
      Auth__Microsoft__TenantId: ${MICROSOFT_TENANT_ID:-}
      Auth__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Auth__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}
      Auth__Microsoft__AutoProvision: ${MICROSOFT_AUTO_PROVISION:-true}
      Email__AppUrl: ${APP_URL:-http://localhost:8080}
      Email__Inbound__Provider: ${EMAIL_INBOUND_PROVIDER:-None}
      Email__Inbound__DefaultAreaId: ${EMAIL_DEFAULT_AREA_ID:-}
      Email__Inbound__CreateUnknownSenders: ${EMAIL_CREATE_UNKNOWN_SENDERS:-true}
      Email__Inbound__Imap__Host: ${IMAP_HOST:-}
      Email__Inbound__Imap__Port: ${IMAP_PORT:-993}
      Email__Inbound__Imap__Username: ${IMAP_USERNAME:-}
      Email__Inbound__Imap__Password: ${IMAP_PASSWORD:-}
      Email__Outbound__Provider: ${EMAIL_OUTBOUND_PROVIDER:-None}
      Email__Outbound__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__Outbound__FromName: ${EMAIL_FROM_NAME:-Mesa de ayuda}
      Email__Outbound__Smtp__Host: ${SMTP_HOST:-}
      Email__Outbound__Smtp__Port: ${SMTP_PORT:-587}
      Email__Outbound__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Outbound__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Graph__TenantId: ${GRAPH_TENANT_ID:-}
      Email__Graph__ClientId: ${GRAPH_CLIENT_ID:-}
      Email__Graph__ClientSecret: ${GRAPH_CLIENT_SECRET:-}
      Email__Graph__Mailbox: ${GRAPH_MAILBOX:-}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  db-data:
