# Instalación completa: base de datos, API y aplicación web.
#   cp .env.example .env   (y cambia los valores)
#   docker compose up -d --build
# La aplicación queda en http://localhost:${HTTP_PORT:-8080}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__HelpDesk: Host=db;Database=helpdesk;Username=helpdesk;Password=${POSTGRES_PASSWORD}
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      Auth__Microsoft__Enabled: ${MICROSOFT_LOGIN_ENABLED:-false}
      Auth__Microsoft__TenantId: ${MICROSOFT_TENANT_ID:-}
      Auth__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Auth__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}
      Auth__Microsoft__AutoProvision: ${MICROSOFT_AUTO_PROVISION:-true}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  db-data:
